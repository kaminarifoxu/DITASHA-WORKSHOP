services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DITASHA_DOMAIN:-workspace.gremoryy.my.id}
      TRUST_PROXY: "1"
    volumes:
      - workspace_data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: [https]
    environment:
      DITASHA_DOMAIN: ${DITASHA_DOMAIN:-workspace.gremoryy.my.id}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  workspace_data:
  caddy_data:
  caddy_config:
