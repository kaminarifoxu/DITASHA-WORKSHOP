name: Build and release desktop, Android and sync server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read application version
        id: version
        run: |
          VERSION=$(sed -n 's/^#define APP_VERSION "\([0-9.]*\)"/\1/p' src/version.h)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Windows compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      - name: Fetch checked SDK inputs
        run: python3 scripts/fetch-vendor.py
      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          node build-adapter-test.mjs
          node ../tests/adapter.mjs
          node ../tests/office-motion.mjs
          node ../tests/characters-3d.mjs
      - name: Test sync server authentication and recovery
        run: node --test sync-server/test/*.test.mjs
      - name: Test update metadata and native JSON validation
        run: |
          gcc -Wall -Wextra -Werror -Wno-misleading-indentation -Ivendor tests/update-core.c -o tests/update-core
          ./tests/update-core
          gcc -Wall -Wextra -Werror -Ivendor tests/json-validation.c -o tests/json-validation
          ./tests/json-validation
          gcc -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -Ivendor tests/chatgpt-core.c -o tests/chatgpt-core
          ./tests/chatgpt-core
          gcc -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -Ivendor tests/api-provider-core.c -o tests/api-provider-core
          ./tests/api-provider-core
      - name: Build Windows application and Windows tests
        run: |
          python3 pack-frontend.py
          bash build.sh
          python3 tests/embedded-ui.py DITASHA-Workspace.exe assets/index.html
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -Wno-misleading-indentation -Ivendor tests/update-windows.c -o tests/update-windows.exe -ladvapi32
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -Wno-misleading-indentation -Wno-unknown-pragmas -isystem vendor tests/chatgpt-windows.c -municode -o tests/chatgpt-windows.exe -lole32 -lshell32 -luser32 -lgdi32 -lwinhttp -lcrypt32 -lbcrypt -lws2_32 -lcomdlg32
          sha256sum DITASHA-Workspace.exe > DITASHA-Workspace.exe.sha256
      - name: Store Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-package
          path: |
            DITASHA-Workspace.exe
            tests/update-windows.exe
            tests/chatgpt-windows.exe
            vendor/MicrosoftEdgeWebview2Setup.exe
          retention-days: 7
      - name: Store release executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            DITASHA-Workspace.exe
            DITASHA-Workspace.exe.sha256
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK inputs
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preserve personal preview signing key
        uses: actions/cache@v4
        with:
          path: android-companion/signing
          key: ditasha-android-preview-signing-v1
      - name: Build and verify Android companion
        env:
          DITASHA_ANDROID_KEYSTORE: signing/preview.keystore
        run: bash android-companion/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android-companion/build/DITASHA-Companion.apk
            android-companion/build/DITASHA-Companion.apk.sha256
          retention-days: 7
  phone-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test driver
        run: npm install --prefix /tmp/ditasha-ui --no-audit --no-fund playwright@1.62.1
      - name: Build frontend for desktop layout verification
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run --prefix frontend build
      - name: Verify fitted desktop workspace
        env:
          DITASHA_PLAYWRIGHT_IMPORT: /tmp/ditasha-ui/node_modules/playwright/index.mjs
          DITASHA_CHROME_EXECUTABLE: /usr/bin/google-chrome
          DITASHA_UI_OUTPUT: desktop-preview
        run: node tests/desktop-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-preview
          path: desktop-preview/*.png
          retention-days: 7
      - name: Test phone interface with real server
        env:
          DITASHA_PLAYWRIGHT_IMPORT: /tmp/ditasha-ui/node_modules/playwright/index.mjs
          DITASHA_CHROME_EXECUTABLE: /usr/bin/google-chrome
          DITASHA_UI_OUTPUT: phone-preview
        run: node sync-server/test/phone-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-preview
          path: phone-preview/*.png
          retention-days: 7
  email-persistence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify encrypted email accounts across restart and update
        shell: powershell
        run: |
          & .\tests\email-persistence.ps1 -Source .\src\assistant-tools.ps1
          if (-not $?) { throw 'Email persistence tests failed' }
  windows-tests:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-package
      - name: Test Lora automation and actual Windows schedule
        shell: powershell
        run: |
          & .\tests\mail-automation.ps1 -Source .\src\assistant-tools.ps1 -TestSchedule
          if (-not $?) { throw 'Mail automation tests failed' }
      - name: Verify Microsoft bootstrapper signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature .\vendor\MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft runtime installer signature' }
      - name: Test updater on Windows
        shell: pwsh
        run: |
          & .\tests\update-windows.exe .\DITASHA-Workspace.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater tests failed' }
      - name: Test ChatGPT crypto and storage on Windows
        shell: pwsh
        run: |
          & .\tests\chatgpt-windows.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows ChatGPT tests failed' }
      - name: Check live public Google Trends feed
        shell: pwsh
        run: |
          try {
            $response = Invoke-WebRequest 'https://trends.google.com/trending/rss?geo=ID' -TimeoutSec 30
            [xml]$feed = $response.Content
            $items = @($feed.rss.channel.item)
            if ($items.Count -lt 1) { throw 'No live RSS items' }
            Write-Output "Live Google Trends Indonesia RSS: $($items.Count) items received."
          } catch {
            Write-Warning 'Live trends feed unavailable on this runner; app reports an error and does not invent trends.'
          }
  release:
    needs: [build, windows-tests, android, phone-ui, email-persistence]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files
      - name: Package Debian sync server
        run: |
          python3 scripts/package-sync-server.py --output release-files/DITASHA-Sync-Server.zip
          sha256sum release-files/DITASHA-Sync-Server.zip > release-files/DITASHA-Sync-Server.zip.sha256
      - name: Publish versioned release after tests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump src/version.h for a new release."
            exit 0
          fi
          git archive --format=zip --prefix=DITASHA-Workspace/ HEAD > release-files/DITASHA-Workspace-Source.zip
          cat > release-notes.md <<'NOTES'
          Automates the Lora-to-Achi handoff: immediate first scan when enabling the 20-minute schedule, automatic payment-status buckets and separate currency totals, automatic Excel updates, and duplicate-safe local ledger imports for clear completed IDR evidence. Failed payments and unpaid invoices stay outside spending; ambiguous evidence alone needs attention. Fixes successful blu payment and blu advertisement subjects. Preserves existing manual decisions and email accounts.

          Improves Lora payment triage to separate promotions, account/security notices and monthly statements from actual receipts, invoices, incoming transfers and failed payments. Reclassifies old unreviewed records while preserving manual reviews and ledger entries. Achi analysis receives saved payment-email evidence separately from recorded ledger totals.

          Fixes the packaged office layout and adds a real 3D Sakura room with furniture, moving employees and a 2D fallback. Shows saved email accounts above the add-account form, with encrypted account-vault recovery and Windows restart/update persistence tests. The release checks that the EXE embeds the exact checked frontend.

          Adds chat beside the office using the same saved conversations and team workflow. Smaller windows have office/chat tabs. Sakura studio adds Japanese-inspired wood, flooring and windows, with adult anime-inspired 3D employees, eight walking poses and alternating work poses.

          Fits the office and dashboard inside the application window. The full office floor scales with the available space, with a compact employee rail and picker. Navigation and the chat composer remain visible; long messages, task lists and settings scroll within their own panels. Browser layout checks cover 1024x600, 1280x720 and 1440x900, ten and eighteen employees, long chats and an active six-member board.

          Adds a Debian VPS sync server, Windows PC pairing and an Android 8+ companion for workspace.gremoryy.my.id. Phone tasks queue offline and run through Amii's employee workflow while the PC app is open. Recent chats, employee model labels, projects, payment metadata and the available Lora/Achi Excel report sync through HTTPS. Text/code files can be submitted and generated files downloaded.

          Includes account login, single-use PC pairing, encrypted PC tokens, revocation, idempotent requests and durable completion recovery. Interrupted work requires review instead of automatic reruns. API keys and Gmail credentials remain on the PC. One PC and one owner are supported. Android background push notifications and phone model editing are not included.

          Download DITASHA-Workspace.exe for Windows, DITASHA-Companion.apk for Android and DITASHA-Sync-Server.zip for the VPS. Follow the server package README for DNS, Docker and either existing Nginx or Caddy HTTPS setup. VPS deployment still requires your server configuration. The Android APK is a personal preview; build/signature checks pass, but physical-device testing and live VPS/AI account testing require your setup.

          Existing office collaboration, Lora's 20-minute sorting and Achi's automatic clear-IDR ledger imports remain available. No automatic email sending or money transfers.

          This repository is private. Configure a fine-grained GitHub token with Contents: Read-only in app Settings for Windows updates. Source code and SHA-256 checksums are included.
          NOTES
          gh release create "$TAG" release-files/DITASHA-Workspace.exe release-files/DITASHA-Workspace.exe.sha256 release-files/DITASHA-Workspace-Source.zip release-files/DITASHA-Companion.apk release-files/DITASHA-Companion.apk.sha256 release-files/DITASHA-Sync-Server.zip release-files/DITASHA-Sync-Server.zip.sha256 --target "$GITHUB_SHA" --title "DITASHA Workspace $TAG" --notes-file release-notes.md

