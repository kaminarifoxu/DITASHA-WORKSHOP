name: Build and release Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read application version
        id: version
        run: |
          VERSION=$(sed -n 's/^#define APP_VERSION "\([0-9.]*\)"/\1/p' src/version.h)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Windows compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      - name: Fetch checked SDK inputs
        run: python3 scripts/fetch-vendor.py
      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          node build-adapter-test.mjs
          node ../tests/adapter.mjs
          node ../tests/office-motion.mjs
          node ../tests/characters-3d.mjs
      - name: Test update metadata and native JSON validation
        run: |
          gcc -Wall -Wextra -Werror -Wno-misleading-indentation -Ivendor tests/update-core.c -o tests/update-core
          ./tests/update-core
          gcc -Wall -Wextra -Werror -Ivendor tests/json-validation.c -o tests/json-validation
          ./tests/json-validation
          gcc -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -Ivendor tests/chatgpt-core.c -o tests/chatgpt-core
          ./tests/chatgpt-core
          gcc -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -Ivendor tests/api-provider-core.c -o tests/api-provider-core
          ./tests/api-provider-core
      - name: Build Windows application and Windows tests
        run: |
          python3 pack-frontend.py
          bash build.sh
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -Wno-misleading-indentation -Ivendor tests/update-windows.c -o tests/update-windows.exe -ladvapi32
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -Wno-misleading-indentation -Wno-unknown-pragmas -isystem vendor tests/chatgpt-windows.c -municode -o tests/chatgpt-windows.exe -lole32 -lshell32 -luser32 -lgdi32 -lwinhttp -lcrypt32 -lbcrypt -lws2_32 -lcomdlg32
          sha256sum DITASHA-Workspace.exe > DITASHA-Workspace.exe.sha256
      - name: Store Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-package
          path: |
            DITASHA-Workspace.exe
            tests/update-windows.exe
            tests/chatgpt-windows.exe
            vendor/MicrosoftEdgeWebview2Setup.exe
          retention-days: 7
      - name: Store release executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            DITASHA-Workspace.exe
            DITASHA-Workspace.exe.sha256
          retention-days: 7
  windows-tests:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-package
      - name: Test Lora automation and actual Windows schedule
        shell: powershell
        run: |
          & .\tests\mail-automation.ps1 -Source .\src\assistant-tools.ps1 -TestSchedule
          if (-not $?) { throw 'Mail automation tests failed' }
      - name: Verify Microsoft bootstrapper signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature .\vendor\MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft runtime installer signature' }
      - name: Test updater on Windows
        shell: pwsh
        run: |
          & .\tests\update-windows.exe .\DITASHA-Workspace.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater tests failed' }
      - name: Test ChatGPT crypto and storage on Windows
        shell: pwsh
        run: |
          & .\tests\chatgpt-windows.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows ChatGPT tests failed' }
      - name: Check live public Google Trends feed
        shell: pwsh
        run: |
          try {
            $response = Invoke-WebRequest 'https://trends.google.com/trending/rss?geo=ID' -TimeoutSec 30
            [xml]$feed = $response.Content
            $items = @($feed.rss.channel.item)
            if ($items.Count -lt 1) { throw 'No live RSS items' }
            Write-Output "Live Google Trends Indonesia RSS: $($items.Count) items received."
          } catch {
            Write-Warning 'Live trends feed unavailable on this runner; app reports an error and does not invent trends.'
          }
  release:
    needs: [build, windows-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files
      - name: Publish versioned release after tests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump src/version.h for a new release."
            exit 0
          fi
          git archive --format=zip --prefix=DITASHA-Workspace/ HEAD > release-files/DITASHA-Workspace-Source.zip
          cat > release-notes.md <<'NOTES'
          Adds Lora's 20-minute Windows background mail sorting, resumable read-only IMAP scans, local categories and an automatically updated Excel payment report. Achi receives a payment review queue with conservative amount/currency extraction and confirmed, duplicate-safe IDR ledger imports. No email moves or automatic money transfers. PC must be awake, online and signed in; attachments are not processed.

          Replaces the chibi characters with shared, shaded 3D employee models using adult proportions. Adds an in-app Gmail connection guide for Lora. All 50 character poses render with valid geometry.

          The previous update remade all ten employees in one consistent chibi style with fixed proportions and shared idle, walking and working animations. Adds Achi for IDR income/expenses/budgets, Lora for multiple Gmail/IMAP inboxes and reply drafts, and Dante for selected-folder inventories, text previews and reviewed rename/move actions. Email credentials stay encrypted on the PC; no automatic email sending, file deletion or overwriting.

          Adds a one-time recommended free OpenRouter team preset, improved built-in role prompts, visible employee instructions and alternative model IDs. Gemma powers general roles and North Mini Code powers FiveM/web roles with at least 8192 output tokens. Custom employee assignments are preserved. Live model availability and quotas require account testing.

          Improves chat layout, renders safe Markdown, adds confirmed single/all chat deletion, text/code attachments and generated file download cards using a Windows Save dialog. Attachments are preserved in chat history/backups and sent to assigned providers. Binary files, PDF and images are not supported.

          Fixes ChatGPT response parsing for standard SSE formatting and completed JSON replies. Adds specific usage/session/token-limit/connection errors and displays completed refusal text. Incomplete jobs are rejected without automatic retries.

          Fixes ChatGPT sign-in by migrating the PC identifier to a stable UUID v4 URN. Adds OpenRouter, Groq, Gemini, OpenAI API and custom HTTPS compatible endpoints, encrypted provider keys, model catalogs/manual model IDs, and provider/model choices for every employee. OpenRouter defaults to free-only mode; API billing is separate from a ChatGPT subscription. Live account login and API access require Windows testing.

          Mika posts research at the task board, then Luna and Sora work concurrently. Sora integrates Luna's completed design before both report to Amii. The native worker pool supports up to three simultaneous requests across providers and preserves updater restart protection. Local backup data includes model assignments and excludes credentials.

          The app checks for new stable releases and can download verified updates automatically. Choose Restart to install when ready. Local data stays in LocalAppData.

          This repository is private: configure a fine-grained GitHub token with Contents: Read-only in app Settings to receive updates.

          Download DITASHA-Workspace.exe. Source code and SHA-256 checksum are included below. Windows updater replacement/rollback tests passed; full desktop UI and live AI calls require manual testing.
          NOTES
          gh release create "$TAG" release-files/DITASHA-Workspace.exe release-files/DITASHA-Workspace.exe.sha256 release-files/DITASHA-Workspace-Source.zip --target "$GITHUB_SHA" --title "DITASHA Workspace $TAG" --notes-file release-notes.md
